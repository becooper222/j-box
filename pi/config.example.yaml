# J-Box configuration.
# Copy to config.yaml (same directory) and fill in the real values.
# config.yaml holds the device token — never commit it.

api:
  # Where the task-manager app is deployed
  base_url: "https://your-task-manager.vercel.app"
  # Must match JBOX_DEVICE_TOKEN in the task-manager environment.
  # Generate one with: openssl rand -hex 32
  device_token: "CHANGE-ME"
  poll_seconds: 60

display:
  # "fb" draws straight to /dev/fb0 (use for the Waveshare 4" HDMI LCD,
  # where SDL's kmsdrm output never reaches the panel); "kmsdrm" is normal SDL
  driver: fb
  # -90 puts the landscape UI upright with the connectors at the
  # bottom on this portrait 480x800 panel; use 90 to flip top-for-bottom
  rotate: 90
  # flip these if taps land in the wrong spot
  touch_swap_xy: false
  touch_invert_x: false
  touch_invert_y: false
  width: 800
  height: 480
  fullscreen: true
  # Seconds per character during the typewriter reveal
  typewriter_delay: 0.045
  # Handwriting face for the notes. fonts/PatrickHand-Regular.ttf is a
  # more casual print alternative; both ship in pi/fonts/.
  font: fonts/Caveat-Variable.ttf
  # How long "Good morning, Julia" holds before the note types out
  greeting_seconds: 2.0
  # Pixels per second a note too long for one screen drifts upward
  scroll_speed: 16.0

gpio:
  # BCM numbering. The LCD covers physical pins 1-26: it uses 7,9,10,11 (touch
  # SPI), 25 (pen IRQ) and 18 (backlight), so our parts live on pins 27-40.
  led_pin: 12          # physical pin 32 (PWM; GPIO18 is the LCD backlight)
  button_pin: 16       # physical pin 36; heart button, other leg to GND
  button_hold_time: 0.8  # seconds held before it counts as a hold
  reed_pin: 26         # physical pin 37; other leg of the reed switch goes to GND
  # With the magnet on the lid and the switch on the box body, the switch is
  # CLOSED (pin pulled to GND) while the lid is closed. If your switch behaves
  # the other way around, flip this.
  lid_closed_when_circuit_closed: true

dates:
  # Fill in before gifting. Leave anniversary empty to hide the day counter.
  anniversary: ""              # e.g. "2018-06-14"
  occasions:
    # Recur every year. label is what the banner shows.
    # - date: "06-14"
    #   label: "Happy Anniversary ♥"
    # - date: "03-02"
    #   label: "Happy Birthday, Julia!"

dev:
  # no reed switch wired yet: stay awake and auto-reveal new notes.
  # set to false once the lid sensor is installed.
  always_open: true
